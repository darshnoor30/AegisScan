services:
  aegisscan:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      AEGISSCAN_ALLOW_PUBLIC: "false"
    volumes:
      - aegisscan-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  aegisscan-data:

